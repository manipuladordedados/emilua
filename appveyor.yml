shallow_clone: true

platform:
  - x64

configuration:
  - Release

image: Visual Studio 2022

environment:
  PKG_CONFIG_PATH: C:/pkgconfig
  BOOST_ROOT: C:/Libraries/boost_1_84_0

install:
  - call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
  - md C:\pkgconfig
  - ps: >-
      Set-Content -Path 'C:\pkgconfig\openssl.pc' -Value 'Name: openssl

      Description: Secure Sockets Layer and cryptography libraries and tools

      Version: 3.2.1

      Libs: -LC:/OpenSSL-v32-Win64/lib/VC/x64/MT -llibssl_static -llibcrypto_static -lcrypt32

      Cflags: -IC:/OpenSSL-v32-Win64/include'

  - meson wrap install luajit
  - choco install pkgconfiglite re2c gperf gawk

build_script:
  - meson setup -Dbackend=ninja -Dluajit:lua52compat=true -Denable_file_io=true -Denable_manpages=false -Dcpp_args=['-DFMT_HEADER_ONLY','-D_WIN32_WINNT=0x0602'] -Dcpp_eh=a -Db_pch=false -Dbuildtype=release -Ddefault_library=static -Db_ndebug=true build
  - meson compile -C build
  - copy C:\Libraries\boost_1_84_0\lib64-msvc-14.3\boost_nowide-vc143-mt-x64-1_84.dll build

test_script:
  - meson test --print-errorlogs "emilua:" -C build

on_finish:
  - curl -F "file=@%APPVEYOR_BUILD_FOLDER%\build\meson-logs\testlog.junit.xml" "https://ci.appveyor.com/api/testresults/junit/%APPVEYOR_JOB_ID%"

artifacts:
  - path: build\emilua.exe
  - path: build\boost_nowide-vc143-mt-x64-1_84.dll
